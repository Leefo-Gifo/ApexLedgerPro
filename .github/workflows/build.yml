name: Build Apex Ledger Pro Flatpak

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Flatpak
    runs-on: ubuntu-latest

    steps:
      - name: Get application source
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune --all --force
          df -h

      - name: Install Flatpak, Builder, and Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb
          pip install --break-system-packages requirements-parser packaging || pip install requirements-parser packaging
          curl -L https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/pip/flatpak-pip-generator.py -o /tmp/flatpak-pip-generator.py

      - name: Add Flathub Remote
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Generate Python dependency manifest
        run: |
          python3 /tmp/flatpak-pip-generator.py \
            --requirements-file=requirements.txt \
            --output=python3-deps

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: org.apexledger.ApexLedgerPro.yml
          bundle: ApexLedgerPro.flatpak
          upload-artifact: true
          artifact-name: ApexLedgerPro
          cache: false
          verbose: true
