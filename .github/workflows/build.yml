
name: Build Apex Ledger Pro Flatpak

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Flatpak
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v2
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      - name: Install Flatpak Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install Python Manifest Generator
        run: |
          python3 -m pip install --break-system-packages requirements-parser packaging
          curl -L https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/pip/flatpak-pip-generator.py -o /tmp/flatpak-pip-generator.py

      - name: Generate Offline PyPI Manifest
        run: |
          python3 /tmp/flatpak-pip-generator.py \
            --requirements-file=requirements.txt \
            --output=python3-deps

      - name: Check Available Disk Space
        run: df -h /

      - name: Build and Bundle Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: org.apexledger.ApexLedgerPro.yml
          bundle: ApexLedgerPro.flatpak
          upload-artifact: true
          artifact-name: ApexLedgerPro-Flatpak
          cache: false
