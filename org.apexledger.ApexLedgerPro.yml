
id: org.apexledger.ApexLedgerPro
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk

base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'

command: apexledgerpro

build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: '1'

cleanup-commands:
  - /app/cleanup-BaseApp.sh

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-documents

modules:
  - python3-deps.json

  - name: apexledgerpro
    buildsystem: simple
    build-commands:
      - install -Dm644 todo.py /app/share/apexledgerpro/todo.py

      - |
        mkdir -p /app/bin
        cat > /app/bin/apexledgerpro <<'EOF'
        #!/bin/sh
        exec /app/bin/python3 /app/share/apexledgerpro/todo.py "$@"
        EOF
        chmod +x /app/bin/apexledgerpro

      - |
        mkdir -p /app/share/applications
        cat > /app/share/applications/org.apexledger.ApexLedgerPro.desktop <<'EOF'
        [Desktop Entry]
        Type=Application
        Name=Apex Ledger Pro
        Comment=Real Estate Financial Management
        Exec=apexledgerpro
        Icon=org.apexledger.ApexLedgerPro
        Terminal=false
        Categories=Office;Finance;
        StartupNotify=true
        EOF

      - |
        mkdir -p /app/share/icons/hicolor/scalable/apps
        cat > /app/share/icons/hicolor/scalable/apps/org.apexledger.ApexLedgerPro.svg <<'EOF'
        <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
          <rect width="128" height="128" rx="24" fill="#172554"/>
          <path d="M25 91 L64 24 L103 91 Z" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linejoin="round"/>
          <path d="M45 91 V69 H83 V91" fill="none" stroke="#ffffff" stroke-width="7"/>
          <path d="M53 52 H75" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
        </svg>
        EOF

    sources:
      - type: dir
        path: .
